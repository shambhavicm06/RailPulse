name: CI

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Set up Node (for the dashboard boot probe)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint for syntax errors
        run: python -m compileall -q src tests

      - name: Verify the dashboard calls nothing protected before sign-in
        run: node tests/boot_probe.mjs src/dashboard.html

      - name: Run test suite
        env:
          # Tests are hermetic: they never touch the developer's user store.
          SWR_SECRET_KEY: ci-test-key
          SWR_AUDIT_DB: /tmp/ci-audit.db
          SWR_USERS_FILE: /tmp/ci-users.json
        run: pytest -q --maxfail=1

      - name: Verify the API boots and serves a prediction
        env:
          SWR_SECRET_KEY: ci-test-key
          SWR_AUDIT_DB: /tmp/ci-audit.db
          SWR_USERS_FILE: /tmp/ci-users.json
        run: |
          cd src && python -m uvicorn app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && break || sleep 2
          done
          TOKEN=$(curl -s -X POST http://127.0.0.1:8000/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"swr2026"}' | python -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          test -n "$TOKEN"
          curl -sf -X POST http://127.0.0.1:8000/predict/manual \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"current_station":"Mysuru","destination":"Hubballi","current_delay_min":20}' \
            | python -c 'import sys,json;d=json.load(sys.stdin);print("predicted:",d["predicted_destination_arrival_delay_min"],"min")'
          curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/graph | grep -q 401
